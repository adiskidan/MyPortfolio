    <script>
      // Global error listener to visibly report any startup issue
      window.addEventListener('error', function(e) {
        console.error('Captured window error:', e);
        var box = document.getElementById('debug-error-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'debug-error-box';
          box.style.position = 'fixed';
          box.style.bottom = '20px';
          box.style.left = '20px';
          box.style.right = '20px';
          box.style.background = '#7f1d1d';
          box.style.color = '#fef2f2';
          box.style.padding = '16px';
          box.style.borderRadius = '12px';
          box.style.zIndex = '999999';
          box.style.fontFamily = 'monospace';
          box.style.fontSize = '12px';
          box.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
          document.body.appendChild(box);
        }
        box.innerHTML = '<strong>⚠️ JavaScript Error:</strong> ' + (e.message || 'Unknown error') + '<br><small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small>';
      });
    </script>
